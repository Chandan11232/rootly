# zerops.yml — Rootly deployment config
# https://docs.zerops.io/references/zerops-yml

# Define services
services:
  - hostname: api
    stack: nodejs-22
    build:
      base: nodejs-22@latest
      buildCommands:
        - cd api && npm install && npm run build
      runCommands:
        - cd api && node dist/index.js
    ports:
      - port: 3001
        httpSupport: true
    envVariables:
      DATABASE_URL: postgres://postgres:${postgres.password}@postgres:5432/incident_analyzer
      NATS_URL: nats://nats:4222
      GROQ_API_KEY: ${GROQ_API_KEY}
      PORT: 3001
    minContainers: 1

  - hostname: worker
    stack: nodejs-22
    build:
      base: nodejs-22@latest
      buildCommands:
        - cd worker && npm install && npm run build
      runCommands:
        - cd worker && node dist/index.js
    envVariables:
      DATABASE_URL: postgres://postgres:${postgres.password}@postgres:5432/incident_analyzer
      NATS_URL: nats://nats:4222
      GROQ_API_KEY: ${GROQ_API_KEY}
    minContainers: 1

  - hostname: frontend
    stack: nodejs-22
    build:
      base: nodejs-22@latest
      buildCommands:
        - cd frontend && npm install && npm run build
      runCommands:
        - cd frontend && npx serve dist -l 5173
    ports:
      - port: 5173
        httpSupport: true
    envVariables:
      VITE_API_URL: http://api:3001
    minContainers: 1

  - hostname: postgres
    stack: postgresql-16
    envVariables:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${postgres.password}
      POSTGRES_DB: incident_analyzer
    minContainers: 1

  - hostname: nats
    stack: nats
    minContainers: 1
