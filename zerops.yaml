zerops:
  # API Server
  - setup: api
    build:
      base: nodejs@22
      buildCommands:
        - cd api && npm install && npm run build
      deployFiles:
        - api/dist
        - api/package.json
        - api/node_modules
    run:
      base: nodejs@22
      ports:
        - port: 3001
          httpSupport: true
      start: node api/dist/index.js
      envVariables:
        DATABASE_URL: ${postgres_connectionString}
        NATS_URL: ${nats_connectionString}
        PORT: 3001

  # Worker
  - setup: worker
    build:
      base: nodejs@22
      buildCommands:
        - cd worker && npm install && npm run build
      deployFiles:
        - worker/dist
        - worker/package.json
        - worker/node_modules
    run:
      base: nodejs@22
      start: node worker/dist/index.js
      envVariables:
        DATABASE_URL: ${postgres_connectionString}
        NATS_URL: ${nats_connectionString}

  # Frontend
  - setup: frontend
    build:
      base: nodejs@22
      buildCommands:
        - cd frontend && npm install --include=dev && npm run build
      deployFiles:
        - frontend/dist
    run:
      base: nodejs@22
      ports:
        - port: 5173
          httpSupport: true
      prepareCommands:
        - npm install -g serve
      start: serve frontend/dist -s -l 5173

  # PostgreSQL (managed)
  - setup: postgres
    run:
      base: postgresql@16

  # NATS (managed)
  - setup: nats
    run:
      base: nats