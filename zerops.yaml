zerops:
  # API Server
  - setup: api
    build:
      base: nodejs@22
      buildCommands:
        - cd api && npm install && npm run build
      deployFiles:
        - api/dist
        - api/package.json
        - api/node_modules
    run:
      base: nodejs@22
      ports:
        - port: 3001
          httpSupport: true
      start: cd api && node dist/index.js
      envVariables:
        DATABASE_URL: postgres://postgres:${postgres.password}@postgres:5432/incident_analyzer
        NATS_URL: nats://nats:4222
        GROQ_API_KEY: ${GROQ_API_KEY}
        PORT: 3001

  # Worker
  - setup: worker
    build:
      base: nodejs@22
      buildCommands:
        - cd worker && npm install && npm run build
      deployFiles:
        - worker/dist
        - worker/package.json
        - worker/node_modules
    run:
      base: nodejs@22
      start: cd worker && node dist/index.js
      envVariables:
        DATABASE_URL: postgres://postgres:${postgres.password}@postgres:5432/incident_analyzer
        NATS_URL: nats://nats:4222
        GROQ_API_KEY: ${GROQ_API_KEY}

  # Frontend
  - setup: frontend
    build:
      base: nodejs@22
      buildCommands:
        - cd frontend && npm install && npm run build
      deployFiles:
        - frontend/dist
    run:
      base: nodejs@22
      ports:
        - port: 5173
          httpSupport: true
      start: npx serve frontend/dist -l 5173

  # PostgreSQL (managed)
  - setup: postgres
    run:
      base: postgresql@16
      envVariables:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: ${postgres.password}
        POSTGRES_DB: incident_analyzer

  # NATS (managed)
  - setup: nats
    run:
      base: nats
