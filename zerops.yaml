zerops:
  # API Server
  - setup: api
    build:
      base: nodejs@22
      buildCommands:
        - |
          cd api
          npm install
          npm run build
          cp -r dist ..
          cp package.json ..
          cp -r node_modules ..
          ls -la /build/source
          ls -la /build/source/dist
      deployFiles:
        - dist
        - package.json
        - node_modules
    run:
      base: nodejs@22
      ports:
        - port: 3001
          httpSupport: true
      start: node dist/index.js
      envVariables:
        DATABASE_URL: ${postgres_connectionString}
        NATS_URL: ${nats_connectionString}
        PORT: 3001

  # Worker
  - setup: worker
    build:
      base: nodejs@22
      buildCommands:
        - |
          cd worker
          npm install
          npm run build
          cp -r dist ..
          cp package.json ..
          cp -r node_modules ..
          ls -la /build/source
          ls -la /build/source/dist
      deployFiles:
        - dist
        - package.json
        - node_modules
    run:
      base: nodejs@22
      start: node dist/index.js
      envVariables:
        DATABASE_URL: ${postgres_connectionString}
        NATS_URL: ${nats_connectionString}

  # Frontend
  - setup: frontend
    build:
      base: nodejs@22
      buildCommands:
        - |
          cd frontend
          npm install --include=dev
          npm run build
          cp -r dist ..
          ls -la /build/source
          ls -la /build/source/dist
      deployFiles:
        - dist
    run:
      base: nodejs@22
      ports:
        - port: 5173
          httpSupport: true
      prepareCommands:
        - npm install -g serve
      initCommands:
        - ls -la /var/www
        - ls -la /var/www/dist 2>/dev/null || echo "dist not found"
      start: serve dist -s -l 5173

  # PostgreSQL (managed)
  - setup: postgres
    run:
      base: postgresql@16
      envVariables:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: ${postgres.password}
        POSTGRES_DB: incident_analyzer

  # NATS (managed)
  - setup: nats
    run:
      base: nats
