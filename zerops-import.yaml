services:
  - hostname: api
    type: nodejs@22
    maxContainers: 1
    enableSubdomainAccess: true
    build:
      base: nodejs@22
      buildCommands:
        - |
          cd api
          npm install
          npm run build
          cp -r dist ..
          cp package.json ..
          cp -r node_modules ..
      deployFiles:
        - dist
        - package.json
        - node_modules
    envVariables:
      DATABASE_URL: ${postgres_connectionString}
      NATS_URL: ${nats_connectionString}
      PORT: 3001

  - hostname: worker
    type: nodejs@22
    maxContainers: 1
    build:
      base: nodejs@22
      buildCommands:
        - |
          cd worker
          npm install
          npm run build
          cp -r dist ..
          cp package.json ..
          cp -r node_modules ..
      deployFiles:
        - dist
        - package.json
        - node_modules
    envVariables:
      DATABASE_URL: ${postgres_connectionString}
      NATS_URL: ${nats_connectionString}

  - hostname: frontend
    type: nodejs@22
    maxContainers: 1
    enableSubdomainAccess: true
    build:
      base: nodejs@22
      buildCommands:
        - |
          cd frontend
          npm install --include=dev
          npm run build
          cp -r dist ..
      deployFiles:
        - dist
    run:
      prepareCommands:
        - npm install -g serve
      start: serve dist -s -l 5173

  - hostname: postgres
    type: postgresql:single@16

  - hostname: nats
    type: nats@2.12