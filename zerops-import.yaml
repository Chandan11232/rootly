services:
  - hostname: api
    type: nodejs@22
    maxContainers: 1
    enableSubdomainAccess: true

  - hostname: worker
    type: nodejs@22
    maxContainers: 1

  - hostname: frontend
    type: nodejs@22
    maxContainers: 1
    enableSubdomainAccess: true

  - hostname: postgres
    type: postgresql:single@16

  - hostname: nats
    type: nats@2.12